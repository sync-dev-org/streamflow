# Example configuration for the native C++ streamflow v0.4.398: LMS input to NDI output.
# The deb and archive include LMS and NDI input/output, CDA-VSR, and SPANv2.
# No Python environment or extras are required. See INSTALL.md for host requirements and installation.
# The deb installs to /opt/streamflow and provides /usr/bin/streamflow.
# An archive provides prefix/bin/streamflow; keep the complete prefix layout.
# Receive the application, a compatible checkpoint, and SHA256SUMS as files from your provider.
# Verify the received files as described in INSTALL.md. Neither the deb nor archive contains weights or engines.
# See ENGINE.md for checkpoint compatibility and KNOWN_LIMITATIONS.md for the measured scope.
# Items marked "Required" have no defaults. Replace <...> with actual values.
# Commented items are optional. Always specify fractions as "numerator/denominator" strings.
# All settings can also be supplied through startup arguments; arguments override this file. See USAGE.md.

pipeline:                         # This entire section is optional
  cuda_device: 0                  # Default: 0. Non-negative integer; CLI: --cuda-device
  pre_buffer_capacity_frames: 4   # Default: 4. Positive integer; CLI: --pre-buffer-capacity-frames. Input module to thread P
  post_buffer_capacity_frames: 5    # Capacity M in frames, at least output.delay_frames; omitted: N + 3

input:
  type: lms                       # Required. lms or ndi
  connection:
    id: "<LMS_ID>"               # Required. 8 characters: abc-defg form (lowercase letters and one hyphen)
    password: ""                 # Required. At most 8 ASCII characters; empty here. Replace if needed
    channel: 1                    # Required. Integer 1..255. Match the connection destination
  fallback_frame_rate: "30000/1001"    # Positive fraction. Fallback when VUI timing is absent or outside the eight periods below. Default: "30000/1001" frames/s
  # Accepted VUI periods: 1/24, 1001/24000, 1/25, 1/30, 1001/30000, 1/50, 1/60, 1001/60000 seconds
  decode_capacity_frames: 30                  # Integer 1..65535. Blocking buffer before decoding and decoder surfaces. Default: 30
  audio_trim_unit_samples: 240     # Integer 0..48000. Sample frames in one unit of audio trimmed by the receiving SDK. Default: 240
  # Sample frame counts are before multiplying by the channel count. At 48 kHz, 240 is 5 ms. 0 excludes the trimmed amount from the audio position
  # The default of 240 comes from observations with the pinned SDK and is not guaranteed by the vendor
  receive_delay_ms: 120                   # Non-negative integer. Receive latency in ms. Default: 120
  # The output audio wait limit is output.audio.max_wait_ms; input does not wait for audio.
  # Set the depth of the drop buffer after decoding with pipeline.pre_buffer_capacity_frames
  # The core fills missing color information with legal, BT.709, and left

# To select NDI input, replace the whole input section above and select SPANv2 below.
# NDI input has no motion vectors or residuals; CDA-VSR stops with the input/model combination before processing a frame.
# input:
#   type: ndi
#   source_name: "camera (Studio A)"     # Required source name. Non-empty string without NUL; spaces are preserved
#   receive_delay_ms: 120                 # Integer 0..2147483647 ms. Default: 120 when absent from file and arguments
# The SDK applies this delay to both video and audio; 0 disables the additional wait.
# Fixed receive-side waits configured by input modules are excluded from the 100 ms latency target.
# CLI: --input-type ndi --input-option "source_name='camera (Studio A)'" --input-option receive_delay_ms=120
# Arguments override file values. NDI receives frames in arrival order without frame sync.

inference:
  type: cda-vsr                   # Required. cda-vsr or spanv2
  weights: "<CDA_VSR_CHECKPOINT_PATH>"  # Required. Relative paths start at this configuration file's directory
  # Requires producer-exported metadata cda_vsr.residual_unit=luma-range and training with that residual unit.
  # Checkpoints without this metadata are rejected at startup.
  # Format conversion or manually adding metadata does not establish compatible training.
  precision: fp16                 # Default: fp16; fp32 is also accepted
  # input_width: 960              # Defaults to the width of the first input frame
  # input_height: 540             # Defaults to the height of the first input frame

# To use the included SPANv2 module, replace the inference section.
# inference:
#   type: spanv2
#   weights: "<SPANV2_CHECKPOINT_PATH>"  # Supply a SPANv2 safetensors checkpoint
#   precision: fp16
#   input_width: 960
#   input_height: 540
# inference.weight_prefix is not accepted for any model.

output:
  # The output opens at the first frame's period and reopens when that period changes.
  # Output is interrupted while reopening. NDI and LMS require prefill_frames=1, checked before the first frame.
  type: ndi                       # Required. NDI output
  source_name: streamflow                 # Non-empty string. Default: streamflow
  width: 1920                      # Required. Width of images placed in the post buffer
  height: 1080                     # Required. Height of images placed in the post buffer
  delay_frames: 2                  # Delay N in frames; CLI: --output-delay-frames. Default: 2
  prefill_frames: 1                # NDI and LMS accept only 1. Default: 1; choose delay with --output-delay-frames
  # D = delay_frames * one input frame period, added to the estimated input progression; encoding follows selection.
  # M counts waiting images, excluding the last image used for repeats. Images whose valid period has ended are discarded with their audio.
  audio:
    enabled: false                # Pass input audio only when true. Default: false
    # max_wait_ms: 0               # Optional finite number >= 0, in ms. Default: one frame period at output open
    # At the limit, missing audio is filled with silence. 0 sends immediately with silence for missing audio

# To select LMS output, replace the output section above with the following.
# output:
#   type: lms
#   connection:
#     id: "<LMS_ID>"             # Required. 8 characters: abc-defg form (lowercase letters and one hyphen)
#     password: ""               # Required. At most 8 ASCII characters; replace if needed
#     channel: 1                  # Required. Integer 1..255
#   width: 1920                   # Required. Do not put this inside video
#   height: 1080                  # Required. Do not put this inside video
#   prefill_frames: 1             # LMS accepts only 1. Default: 1; choose delay with --output-delay-frames
#   audio:
#     enabled: false              # Default: false
#     # max_wait_ms: 0             # Optional finite number >= 0, in ms. Default: one frame period at output open
#     # At the limit, missing audio is filled with silence. 0 sends without waiting
#   video:
#     bit_depth: 8                # Default: 8
#     colorspace: Rec.709         # Default: Rec.709
#     gamma: Rec.709              # Default: Rec.709
#     matrix: BT.709              # Default: BT.709
#     siting: left         # Default: left
#     range: legal                # Default: legal
#   encoder:
#     bitrate_bps: 10000000       # Default: 10000000
#     gop_frames: 30              # Default: 30
#     # idr_interval_frames: 30            # Defaults to the value of gop_frames
#     rate_control: cbr           # cbr (default) or vbr
#     max_bitrate_bps: 0          # Default: 0
#   conversion:
#     allow_colorspace: true      # Default: true
#     allow_gamma: true           # Default: true
#     allow_matrix: true          # Default: true

# LMS output uses connection / video / encoder / conversion mappings.
# Flat keys such as output.id, output.video_range, and output.work_queue_depth are not accepted.
# encoder.vbv_buffer_bits, encoder.latency_profile, and buffering.work_queue_depth are also rejected.

# SRT input and output are not supported by this version of streamflow.
# Selecting input.type: srt or output.type: srt reports the unsupported setting and exits before the first frame.

# Optional diagnostic timestamps. Omit this section to disable recording.
# diagnostics:
#   stage_trace:
#     path: trace.json           # Relative to the process's current directory, including in YAML
#     capacity: 9000             # Positive integer. Default: 9000. Older records are overwritten
# The path is opened/truncated at startup; its parent directory must exist and be writable.
# The JSON trace document is written after cleanup; a second stop can prevent that write.

